name: version.json aktualisieren

# Die App prueft beim Oeffnen und alle zehn Minuten, ob eine neue Fassung online
# steht. Dafuer die ganze index.html (200 KB) zu laden waere Verschwendung, nur
# um eine Zahl abzulesen. Dieser Lauf schreibt die Nummer in version.json.
# Er haengt an "push", nicht an "schedule", und wird deshalb nicht gedrosselt.
# Commits mit GITHUB_TOKEN loesen keine weiteren Laeufe aus - keine Schleife.
# Uebernommen aus dem Wetter-Projekt.

on:
  push:
    branches: [main]
    paths: ["index.html", "labor.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummern lesen und schreiben
        run: |
          # App: die Nummer steht nackt in der .ver-Zeile ("v0.72").
          V=$(grep -o 'class="ver">v[0-9.]*' index.html | head -1 | sed 's/.*>v//')
          if [ -z "$V" ]; then echo "keine Versionsnummer in index.html"; exit 1; fi
          echo "App: $V"
          printf '{"version":"%s"}\n' "$V" > version.json
          # Labor: eigene Zaehlung, die Zeile traegt zusaetzlich den Namen
          # ("Zeiger-Labor v0.10"). Eigene Standdatei, sonst wuerde sich das
          # Labor an der App-Nummer messen.
          W=$(grep -o 'class="ver">[^<]*v[0-9.]*' labor.html | head -1 | sed 's/.*v//')
          if [ -z "$W" ]; then echo "keine Versionsnummer in labor.html"; exit 1; fi
          echo "Labor: $W"
          printf '{"version":"%s"}\n' "$W" > labor.json
          if git diff --quiet version.json labor.json; then echo "unveraendert"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json labor.json
          git commit -q -m "Versionsdateien: App v$V, Labor v$W"
          git push
